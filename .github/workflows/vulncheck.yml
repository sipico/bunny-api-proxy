name: Weekly vulnerability check

# CI runs govulncheck only when code changes. New vulnerabilities in Go or in
# a dependency are published at any time, and Dependabot no longer proposes
# Go image bumps (see .github/dependabot.yml), so check main every week as
# well. A failed run notifies the repository owner by e-mail; fix it with a
# Go or dependency upgrade PR.

on:
  schedule:
    - cron: '23 4 * * 1'  # Mondays 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
