name: bunny.net API probe

# TEMPORARY on branch claude/upbeat-shannon-gqlzcc only: PUT retry
# experiment (_experiments/putretry). Reverted after the run; main keeps
# the real probe workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bunny-api-probe
  cancel-in-progress: false

jobs:
  experiment:
    name: PUT retry experiment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Run experiment
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_TEST_KEY }}
        run: |
          go run ./_experiments/putretry -run-id "x${GITHUB_RUN_ID}" | tee result.md
          cat result.md >> "$GITHUB_STEP_SUMMARY"
