name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  # Manual run (Actions -> CI -> Run workflow, pick a branch). Runs as the
  # person who starts it, with Actions secrets. Used to run real-API E2E on
  # Dependabot PRs, where that job is skipped automatically (see below).
  workflow_dispatch:

# Cancel in-progress CI for the same PR/branch when new commits are pushed
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Preflight: deduplicate push/PR runs and detect docs-only changes.
  # - Push events: wait 15s for a PR to appear, then skip if one exists.
  # - Docs-only changes: skip all CI jobs (they report as "skipped" which satisfies required checks).
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Deduplicate CI runs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # Wait for potential PR creation (sub-agents push then create PR within seconds)
            echo "Waiting 15s for potential PR creation..."
            sleep 15
            PR_COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq length)
            if [ "$PR_COUNT" -gt 0 ]; then
              echo "should_skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping push CI — PR exists, PR-triggered CI will run instead"
              exit 0
            fi
          fi

          echo "should_skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.check.outputs.should_skip != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changes
        if: steps.check.outputs.should_skip != 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || echo "UNKNOWN")

          if [ "$CHANGED_FILES" = "UNKNOWN" ] || [ -z "$CHANGED_FILES" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not determine changed files — running full CI"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if ALL changed files are docs/non-code
          DOCS_ONLY=true
          while IFS= read -r file; do
            case "$file" in
              *.md|docs/*|.gitignore|.github/workflows/explore-api.yml) ;;
              *) DOCS_ONLY=false; break ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "::notice::Docs-only change detected — skipping CI jobs"
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.should_skip != 'true' && needs.preflight.outputs.docs_only != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test -p 4 -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Install go-test-coverage
        run: go install github.com/vladopajic/go-test-coverage/v2@v2.19.0

      - name: Check test coverage
        run: go-test-coverage --config .testcoverage.yml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.should_skip != 'true' && needs.preflight.outputs.docs_only != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'

      - name: Run gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted with gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [preflight]
    if: needs.preflight.outputs.should_skip != 'true' && needs.preflight.outputs.docs_only != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Skip build/docker/e2e on push-to-main (already validated by PR pipeline)
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'

      - name: Build proxy binary
        env:
          CGO_ENABLED: 0
        run: go build -o bunny-api-proxy ./cmd/bunny-api-proxy

      - name: Build mockbunny binary
        env:
          CGO_ENABLED: 0
        run: go build -o mockbunny ./cmd/mockbunny

      - name: Upload proxy binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: bunny-api-proxy
          path: bunny-api-proxy
          retention-days: 7

      - name: Upload mockbunny binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: mockbunny
          path: mockbunny
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint, build]  # Wait for binary to be built
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create build contexts for pre-built binaries
        run: |
          # Create separate build directories to avoid .dockerignore conflicts
          mkdir -p ci-build/proxy ci-build/mockbunny

      - name: Download binary artifact
        uses: actions/download-artifact@v8
        with:
          name: bunny-api-proxy
          path: ci-build/proxy

      - name: Download mockbunny binary artifact
        uses: actions/download-artifact@v8
        with:
          name: mockbunny
          path: ci-build/mockbunny

      - name: Make binaries executable
        run: |
          chmod +x ci-build/proxy/bunny-api-proxy
          chmod +x ci-build/mockbunny/mockbunny

      - name: Verify binaries exist
        run: |
          ls -lah ci-build/proxy/bunny-api-proxy ci-build/mockbunny/mockbunny
          file ci-build/proxy/bunny-api-proxy ci-build/mockbunny/mockbunny

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build proxy Docker image (using pre-built binary)
        uses: docker/build-push-action@v7
        with:
          context: ci-build/proxy
          file: .claude/docker/Dockerfile.prebuilt
          push: false
          load: true
          tags: bunny-api-proxy:test

      - name: Build mockbunny Docker image (using pre-built binary)
        uses: docker/build-push-action@v7
        with:
          context: ci-build/mockbunny
          file: .claude/docker/Dockerfile.mockbunny.prebuilt
          push: false
          load: true
          tags: mockbunny:test

      - name: Build test-runner Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .claude/docker/Dockerfile.testrunner
          push: false
          load: true
          tags: test-runner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker images as tarballs
        run: |
          docker save bunny-api-proxy:test -o /tmp/bunny-api-proxy.tar
          docker save mockbunny:test -o /tmp/mockbunny.tar
          docker save test-runner:test -o /tmp/test-runner.tar
          ls -lh /tmp/*.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v7
        with:
          name: docker-images
          path: |
            /tmp/bunny-api-proxy.tar
            /tmp/mockbunny.tar
            /tmp/test-runner.tar
          retention-days: 1

  e2e-test:
    name: E2E Tests (Mock)
    runs-on: ubuntu-latest
    needs: [test, lint, docker]  # Wait for Docker images to be built
    env:
      # Not a secret: proxy, mockbunny and the test runner only need to agree
      # on the same non-empty value, and mockbunny protects nothing. A fixed
      # value lets mock E2E run on Dependabot PRs, which get no Actions secrets.
      MOCK_E2E_KEY: mock-e2e-not-a-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker images
        uses: actions/download-artifact@v8
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: |
          docker load --input /tmp/bunny-api-proxy.tar
          docker load --input /tmp/mockbunny.tar
          docker load --input /tmp/test-runner.tar
          docker images

      - name: Create test data directory
        run: |
          rm -rf /tmp/proxy-data
          mkdir -p /tmp/proxy-data
          chmod 777 /tmp/proxy-data

      - name: Stop and remove previous containers
        run: |
          docker compose -f .claude/docker/docker-compose.test.yml --profile mock down -v || true

      - name: Start services (Mock Mode - using pre-built images)
        env:
          BUNNY_MASTER_API_KEY: ${{ env.MOCK_E2E_KEY }}
        run: |
          docker compose -f .claude/docker/docker-compose.test.yml --profile mock up -d

      - name: Wait for services to be healthy
        env:
          BUNNY_MASTER_API_KEY: ${{ env.MOCK_E2E_KEY }}
        run: |
          echo "Waiting for services..."
          timeout 60 bash -c 'until docker compose -f .claude/docker/docker-compose.test.yml ps | grep -q "healthy"; do sleep 2; done'
          docker compose -f .claude/docker/docker-compose.test.yml ps

      - name: Run E2E tests
        env:
          BUNNY_MASTER_API_KEY: ${{ env.MOCK_E2E_KEY }}
          # Unique per run + attempt; used in test zone names (see tests/testenv getCommitHash)
          E2E_RUN_ID: r${{ github.run_id }}a${{ github.run_attempt }}
        run: |
          mkdir -p e2e-logs
          set -o pipefail
          docker compose -f .claude/docker/docker-compose.test.yml run --rm --no-deps test-runner 2>&1 | tee e2e-logs/test-runner.log

      - name: Collect logs
        if: always()
        env:
          BUNNY_MASTER_API_KEY: ${{ env.MOCK_E2E_KEY }}
        run: |
          mkdir -p e2e-logs
          docker compose -f .claude/docker/docker-compose.test.yml logs proxy > e2e-logs/proxy.log 2>&1 || true
          docker compose -f .claude/docker/docker-compose.test.yml logs mockbunny > e2e-logs/mockbunny.log 2>&1 || true
          docker compose -f .claude/docker/docker-compose.test.yml ps > e2e-logs/services.log 2>&1 || true

      - name: Analyze E2E logs for hidden problems
        if: always()
        run: |
          bash .claude/scripts/analyze-e2e-logs.sh e2e-logs

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7

      - name: Cleanup
        if: always()
        env:
          BUNNY_MASTER_API_KEY: ${{ env.MOCK_E2E_KEY }}
        run: |
          docker compose -f .claude/docker/docker-compose.test.yml down -v

  e2e-test-real-api:
    name: E2E Tests (Real Bunny.net API)
    runs-on: ubuntu-latest
    needs: [test, lint, docker]  # Runs in parallel with mock E2E (separate runner, no interference)
    # Runs on PRs to main and on manual runs (workflow_dispatch).
    # Skipped for Dependabot: the real bunny.net key is never exposed to a run
    # Dependabot started. Run it yourself on a Dependabot branch via
    # Actions -> CI -> Run workflow. A skipped check counts as passing.
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main' && github.actor != 'dependabot[bot]')
      || github.event_name == 'workflow_dispatch'

    steps:
      # Multiple PRs share one bunny.net account — serialize real API E2E to avoid
      # zone creation/deletion conflicts. FIFO by run ID (lowest goes first).
      # No concurrency group needed: no cancellation, no silent job dropping.
      #
      # Another run's real-API job is in one of two states, read from the status
      # of its own "Wait for exclusive real API access" step:
      #   - HOLDER: lock step completed, job still in progress -> it is running
      #     tests against bunny.net. Everyone waits, whatever its run ID.
      #   - WAITER: lock step still running -> it is queued. Only runs with a
      #     higher ID wait behind it; a lower-ID run never waits for a
      #     higher-ID waiter (that was the deadlock: both sides waited for each
      #     other until the timeout, then all ran at once).
      - name: Wait for exclusive real API access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Run $GITHUB_RUN_ID waiting for exclusive real API access..."
          MAX_WAIT=900  # 15 minutes
          WAITED=0
          POLL=30
          LOCK_STEP="Wait for exclusive real API access"
          E2E_JOB="E2E Tests (Real Bunny.net API)"

          while [ $WAITED -lt $MAX_WAIT ]; do
            ACTIVE_RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?status=in_progress" \
              --jq '[.workflow_runs[].id]' 2>/dev/null || echo "[]")

            HOLDER=""
            LOWER_WAITER=""
            for RUN_ID in $(echo "$ACTIVE_RUNS" | jq -r '.[]'); do
              [ "$RUN_ID" = "$GITHUB_RUN_ID" ] && continue

              # Prints nothing if that run has no in-progress real API E2E job;
              # otherwise the status of its lock step ("pending" if not reported yet).
              LOCK_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
                --jq "[.jobs[] | select(.name == \"$E2E_JOB\" and .status == \"in_progress\")][0] // empty
                      | ([.steps[]? | select(.name == \"$LOCK_STEP\")][0].status // \"pending\")" \
                2>/dev/null || echo "")

              if [ "$LOCK_STATUS" = "completed" ]; then
                HOLDER=$RUN_ID
                break
              elif [ -n "$LOCK_STATUS" ] && [ "$RUN_ID" -lt "$GITHUB_RUN_ID" ]; then
                LOWER_WAITER=$RUN_ID
              fi
            done

            if [ -n "$HOLDER" ]; then
              echo "Run $HOLDER is running real API E2E — waiting... (${WAITED}s elapsed)"
            elif [ -n "$LOWER_WAITER" ]; then
              echo "Run $LOWER_WAITER (lower ID) is queued ahead of us — waiting... (${WAITED}s elapsed)"
            else
              echo "No run holds the lock and none is queued ahead. Proceeding (run $GITHUB_RUN_ID)."
              break
            fi

            sleep $POLL
            WAITED=$((WAITED + POLL))
          done

          if [ $WAITED -ge $MAX_WAIT ]; then
            echo "::warning::Timed out after ${MAX_WAIT}s waiting for exclusive access. Proceeding anyway."
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Docker images
        uses: actions/download-artifact@v8
        with:
          name: docker-images
          path: /tmp

      - name: Load Docker images
        run: |
          docker load --input /tmp/bunny-api-proxy.tar
          docker load --input /tmp/test-runner.tar
          docker images

      - name: Create test data directory
        run: |
          rm -rf /tmp/proxy-data
          mkdir -p /tmp/proxy-data
          chmod 777 /tmp/proxy-data

      - name: Start services (Real API Mode - using pre-built images)
        env:
          BUNNY_MASTER_API_KEY: ${{ secrets.BUNNY_API_TEST_KEY }}
          BUNNY_API_URL: ""  # Empty to use default (https://api.bunny.net)
        run: |
          # Use override file to allow external network access for real API
          # No --profile mock: skips mockbunny, only starts proxy
          docker compose -f .claude/docker/docker-compose.test.yml -f .claude/docker/docker-compose.real-api.yml up -d proxy

      - name: Wait for proxy to be healthy
        env:
          BUNNY_MASTER_API_KEY: ${{ secrets.BUNNY_API_TEST_KEY }}
        run: |
          echo "Waiting for proxy..."
          timeout 60 bash -c 'until docker compose -f .claude/docker/docker-compose.test.yml -f .claude/docker/docker-compose.real-api.yml ps proxy | grep -q "healthy"; do sleep 2; done'
          docker compose -f .claude/docker/docker-compose.test.yml -f .claude/docker/docker-compose.real-api.yml ps

      - name: Run E2E tests against real API
        env:
          BUNNY_MASTER_API_KEY: ${{ secrets.BUNNY_API_TEST_KEY }}
          # Unique per run + attempt; used in test zone names (see tests/testenv getCommitHash)
          E2E_RUN_ID: r${{ github.run_id }}a${{ github.run_attempt }}
        run: |
          mkdir -p e2e-logs
          set -o pipefail
          docker compose -f .claude/docker/docker-compose.test.yml -f .claude/docker/docker-compose.real-api.yml run --rm --no-deps test-runner 2>&1 | tee e2e-logs/test-runner.log

      - name: Collect logs
        if: always()
        env:
          BUNNY_MASTER_API_KEY: ${{ secrets.BUNNY_API_TEST_KEY }}
        run: |
          mkdir -p e2e-logs
          docker compose -f .claude/docker/docker-compose.test.yml -f .claude/docker/docker-compose.real-api.yml logs proxy > e2e-logs/proxy.log 2>&1 || true
          docker compose -f .claude/docker/docker-compose.test.yml -f .claude/docker/docker-compose.real-api.yml ps > e2e-logs/services.log 2>&1 || true

      - name: Analyze E2E logs for hidden problems (Real API)
        if: always()
        run: |
          bash .claude/scripts/analyze-e2e-logs.sh e2e-logs

      - name: Upload E2E logs (Real API)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-real-api
          path: e2e-logs/
          retention-days: 7

      - name: Cleanup
        if: always()
        env:
          BUNNY_MASTER_API_KEY: ${{ secrets.BUNNY_API_TEST_KEY }}
        run: |
          docker compose -f .claude/docker/docker-compose.test.yml -f .claude/docker/docker-compose.real-api.yml down -v
